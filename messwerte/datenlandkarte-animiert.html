<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GENEius Datenlandkarte – animiert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--lime:#C6D63F;--pbg:rgba(26,0,21,.78);--pink:#fff;--psub:rgba(255,255,255,.6);--pline:rgba(255,255,255,.14);--f:'Montserrat',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f);background:radial-gradient(circle at 40% 45%,#3C0033,#1A0015 60%,#0E000B);color:var(--pink);-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .4s}
body.light{background:radial-gradient(circle at 40% 45%,#FFFFFF,#F7EEF4 60%,#EFDDE8);--pbg:rgba(255,255,255,.86);--pink:#2A0022;--psub:#7A5D72;--pline:rgba(94,0,71,.14)}
.stage{position:fixed;inset:0 340px 0 0;display:grid;place-items:center}
.stage svg{width:min(100%,100vh);height:auto;max-height:100vh;display:block;cursor:grab}
svg text{font-family:'Montserrat',sans-serif}
.panel{position:fixed;top:0;right:0;bottom:0;width:340px;background:var(--pbg);backdrop-filter:blur(14px);border-left:1px solid var(--pline);display:flex;flex-direction:column;z-index:2;transition:transform .3s}
.ph{padding:20px 20px 12px;border-bottom:1px solid var(--pline)}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.22em;color:var(--lime);text-transform:uppercase}
body.light .eyebrow{color:#7C8A10}
h1{font-size:20px;font-weight:800;margin:3px 0 4px}
.ph p{font-size:12.5px;color:var(--psub);line-height:1.45}
.pb{overflow:auto;padding:6px 20px 24px;flex:1}
.grp{padding:14px 0 6px;border-bottom:1px solid var(--pline)}
.grp:last-child{border-bottom:0}
.gt{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--psub);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.gt span{display:flex;gap:4px}
.mini{font:inherit;font-size:11px;font-weight:700;letter-spacing:0;text-transform:none;padding:3px 9px;border-radius:99px;border:1px solid var(--pline);background:transparent;color:var(--pink);cursor:pointer}
.mini:hover{border-color:var(--lime)}
.row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13.5px;font-weight:600;cursor:pointer;user-select:none}
.row input{appearance:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--c,var(--lime));flex:none;display:grid;place-items:center;cursor:pointer;transition:background .15s}
.row input:checked{background:var(--c,var(--lime))}
.row input:checked::after{content:'';width:5px;height:10px;border:solid #26001D;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
body.light .row input:checked::after{border-color:#fff}
.row input:indeterminate{background:linear-gradient(var(--c,var(--lime)),var(--c,var(--lime))) center/10px 2.5px no-repeat}
.row svg{flex:none}
.row .n{margin-left:auto;font-size:11.5px;color:var(--psub);font-weight:600}
details.br{border-radius:10px}
details.br summary{list-style:none;display:flex;align-items:center}
details.br summary::-webkit-details-marker{display:none}
details.br summary .row{flex:1}
details.br summary .tg{width:26px;height:26px;display:grid;place-items:center;border-radius:6px;color:var(--psub);cursor:pointer;flex:none;transition:transform .2s}
details.br[open] summary .tg{transform:rotate(90deg)}
details.br .lv{padding:0 0 6px 30px}
details.br .lv .row{font-size:12.5px;font-weight:500;padding:3px 0}
details.br .lv .row input{width:16px;height:16px;border-radius:5px;border-width:1.5px}
details.br .lv .row input:checked::after{width:4px;height:8px;border-width:0 2px 2px 0}
.lv .neu{font-style:italic;color:#9A8794}
body.light .lv .neu{color:#A39CA8}
.key{position:fixed;left:18px;bottom:16px;z-index:2;display:flex;gap:16px;font-size:12.5px;font-weight:700;color:var(--pink);background:rgba(38,0,29,.55);padding:8px 14px;border-radius:99px;backdrop-filter:blur(6px)}
body.light .key{background:rgba(255,255,255,.75);color:#3C0033}
.key span{display:flex;align-items:center;gap:7px}
.key i{width:22px;height:8px;border-radius:4px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:99px;border:1px solid var(--pline);background:transparent;color:var(--pink);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--lime);color:#26001D;border-color:var(--lime)}
.ctl{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;padding:4px 0}
.ctl input[type=range]{flex:1;accent-color:var(--lime)}
.play{font:inherit;font-weight:800;font-size:13px;padding:8px 14px;border-radius:99px;border:0;background:var(--lime);color:#26001D;cursor:pointer;min-width:104px}
.menu{display:none;position:fixed;right:14px;top:14px;z-index:3;font:inherit;font-weight:800;font-size:13px;padding:10px 16px;border-radius:99px;border:0;background:var(--lime);color:#26001D;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.tip{position:fixed;pointer-events:none;background:#26001D;color:#fff;font-size:12.5px;font-weight:600;padding:8px 11px;border-radius:10px;max-width:280px;opacity:0;transition:opacity .12s;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.tip b{color:var(--lime)}
@media (max-width:860px){
  .stage{inset:0}
  .panel{width:min(340px,92vw);transform:translateX(100%)}
  .panel.open{transform:none}
  .menu{display:block}
}
html.bg .panel,html.bg .menu,html.bg .key,html.bg .tip{display:none!important}
html.bg .stage{inset:0;pointer-events:none}
html.bg body{background:transparent}
html.bgt,html.bgt body{background:transparent!important}
</style>
</head>

MAP.addEventListener('pointerenter',()=>hovering=true);
MAP.addEventListener('pointerleave',()=>{hovering=false;hoverB=-1;tip.style.opacity=0;dirty=true});
MAP.addEventListener('pointerdown',e=>{const p=svgPt(e);drag={a:Math.atan2(p.y-cy,p.x-cx),r:rot};MAP.setPointerCapture(e.pointerId);MAP.style.cursor='grabbing'});
MAP.addEventListener('pointerup',()=>{drag=null;MAP.style.cursor=''});
MAP.addEventListener('pointermove',e=>{
  const p=svgPt(e);
  if(drag){rot=drag.r+Math.atan2(p.y-cy,p.x-cx)-drag.a;dirty=true;return}
  const g=e.target.closest&&e.target.closest('[data-b]');const nb=g?+g.dataset.b:-1;
  if(nb!==hoverB){hoverB=nb;dirty=true}
  const lt=e.target.closest&&e.target.closest('text[data-l]');
  if(lt){const [i,j]=lt.dataset.l.split('.').map(Number),l=B[i].l[j];
    tip.innerHTML=`<b>${esc(B[i].name)}</b><br>${esc(l.t)}${l.neu?'<br><i>Fehlt noch – Vorschlag</i>'+(l.h?': '+esc(l.h):''):l.n!=null?'<br>'+fmt(l.n)+' Messgrößen':''}`;
    tip.style.left=Math.min(innerWidth-300,e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';tip.style.opacity=1}
  else if(g){const b=B[nb];tip.innerHTML=`<b>${esc(b.name)}</b><br>${b.l.length} Einträge · ${fmt(nHave(b))} Messgrößen`;tip.style.left=Math.min(innerWidth-300,e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';tip.style.opacity=1}
  else tip.style.opacity=0});
if(!VIZ.some(v=>v[0]===S.viz))S.viz='strahl';
sync();theme();vizUi();requestAnimationFrame(tick);
</script>
</body>
</html>
