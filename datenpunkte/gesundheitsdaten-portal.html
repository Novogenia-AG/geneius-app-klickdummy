<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deine Gesundheitsdaten</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#2E0D29;--bg2:#3A1234;--card:#46183F;--card2:#55204D;--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.26);--ink:#fff;--sub:rgba(255,255,255,.78);--mut:rgba(255,255,255,.58);
 --lime:#C6D63F;--p:#8C1D6E;--p2:#B0306E;--ok:#7BD88F}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;background:var(--bg2);border-right:1px solid var(--line);padding:18px 12px 24px}
.logo{display:flex;gap:10px;align-items:center;padding:4px 10px 16px}
.logo .m{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#5E0047,#B0306E);display:grid;place-items:center;font-weight:800;color:var(--lime)}
.logo b{font-size:15px;letter-spacing:.02em}.logo b span{color:var(--lime)}
.logo small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.nh{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:14px 10px 6px}
.ni{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:10px;padding:9px 10px;text-align:left;font-weight:600;font-size:13.5px;color:var(--sub)}
.ni:hover{background:rgba(255,255,255,.05);color:#fff}
.ni[aria-current=page]{background:rgba(198,214,63,.12);color:#fff}
.ni .dot{width:10px;height:10px;border-radius:3px;flex:none}
.ni .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.06);flex:none;color:var(--lime)}
.ni .c{margin-left:auto;font-size:11px;font-weight:700;color:var(--mut)}
.ni .c.ok{color:var(--ok)}
main{min-width:0;position:relative}
.mtop{display:none}
.content{max-width:920px;margin:0 auto;padding:22px 26px 90px}
.hero{position:relative;height:min(76vh,620px);min-height:440px;overflow:hidden;margin:-22px -26px 18px;background:radial-gradient(ellipse at 66% 50%,rgba(94,0,71,.55),rgba(46,13,41,0) 62%)}
.hero iframe{position:absolute;top:50%;right:max(-30%,calc(560px - min(118vh,980px)));width:min(118vh,980px);height:min(118vh,980px);transform:translateY(-50%);border:0;pointer-events:none;opacity:.9}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,rgba(46,13,41,.92) 38%,rgba(46,13,41,.25) 62%,rgba(46,13,41,0) 100%),linear-gradient(0deg,var(--bg) 0%,rgba(46,13,41,0) 22%);pointer-events:none}
.hero .tx{position:absolute;left:26px;top:50%;transform:translateY(-50%);max-width:min(400px,44%);z-index:2}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.hero h1{margin:8px 0 10px;font-size:clamp(28px,3.2vw,38px);line-height:1.12;font-weight:800;letter-spacing:-.015em}
.hero p{margin:0 0 20px;color:var(--sub);font-size:15.5px}
.bl{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px;display:inline-flex;gap:8px;align-items:center}
.bl.lime{background:var(--lime);color:#26001D}
.bl.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line2)}
.bl.sm{padding:9px 13px;font-size:13.5px;border-radius:11px}
.sec-t{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:26px 0 10px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.step{--sc:#C6D63F;position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .15s,border-color .15s}
.step:hover{transform:translateY(-2px);border-color:var(--line2)}
.step::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--sc) 30%,transparent),transparent 60%);pointer-events:none}
.step .n{position:relative;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--sc);color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--sc) 45%,transparent)}
.step .n svg{width:26px;height:26px}
.step .ok{position:absolute;right:14px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--ok);color:#0E2414;display:grid;place-items:center}
.step .st{position:relative;margin-top:auto;align-self:flex-start;background:var(--lime);color:#26001D;border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:800}
.step.done .st{background:rgba(123,216,143,.18);color:var(--ok)}
.step b,.step small{position:relative}
.step:hover{border-color:var(--sc)}

.step b{font-size:16px;margin-top:6px}
.step small{color:var(--sub);font-size:13px}


.bubble{position:absolute;top:16px;right:22px;z-index:35;width:290px;text-align:left;border:0;border-radius:18px 18px 4px 18px;background:#fff;color:#26001D;padding:14px 16px 14px 14px;display:flex;gap:12px;box-shadow:0 14px 34px rgba(0,0,0,.45);animation:pop .5s ease-out both}
.bubble .i{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#5E0047,#B0306E);color:var(--lime);display:grid;place-items:center;flex:none}
.bubble b{display:block;font-size:14px;line-height:1.25;margin-bottom:3px}
.bubble small{display:block;font-size:12.5px;color:#5B4A58;line-height:1.4}
.bubble .go{display:inline-flex;gap:4px;align-items:center;margin-top:8px;font-size:12.5px;font-weight:800;color:#8C1D6E}
.bubble:hover{transform:translateY(-1px)}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:none}}
.banner{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--lime);color:#26001D;padding:11px 22px;text-align:left;font-size:14px;line-height:1.35}
.banner:hover{background:#D3E24F}
.banner .i{width:34px;height:34px;border-radius:10px;background:#26001D;color:var(--lime);display:grid;place-items:center;flex:none}
.banner .t{flex:1}.banner .t b{font-weight:800}
.banner .go{font-weight:800;white-space:nowrap;display:flex;align-items:center;gap:4px;background:#26001D;color:var(--lime);border-radius:10px;padding:8px 12px;font-size:13px}
.wzs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 22px}
.wzs div{display:flex;flex-direction:column;gap:6px;font-size:11.5px;font-weight:700;color:var(--mut)}
.wzs div i{height:6px;border-radius:99px;background:rgba(255,255,255,.1)}
.wzs div.done i{background:var(--ok)}.wzs div.cur{color:#fff}.wzs div.cur i{background:var(--lime)}
.wzh{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--lime);margin-bottom:6px}
.wzq{font-size:26px;font-weight:800;line-height:1.22;margin:4px 0 10px;letter-spacing:-.01em}
.dxg{margin:14px 0}.dxg h4{margin:0 0 8px;font-size:13px;color:var(--sub);font-weight:800}
.genebox{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:10px;font-size:15px}
.genebox .bi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.wheel{max-width:620px;margin:6px auto 4px}.wheel svg{width:100%;height:auto;display:block}
.sumg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 20px}
.sumg div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.sumg b{display:block;font-size:24px;color:var(--lime)}.sumg small{color:var(--sub);font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--line2);transform:translateY(-1px)}
.tile .bi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.tile b{display:block;font-size:13.5px;line-height:1.25}
.tile small{display:block;font-size:11.5px;color:var(--mut);margin-top:2px}
.tile small.ok{color:var(--ok)}
.ni .bi{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.tabs{display:none}
.tip{display:flex;gap:12px;align-items:center;background:rgba(198,214,63,.07);border:1px solid rgba(198,214,63,.25);border-radius:14px;padding:12px 14px;margin:18px 0 0;font-size:13.5px}
.tip .i{width:32px;height:32px;border-radius:10px;background:rgba(198,214,63,.16);color:var(--lime);display:grid;place-items:center;flex:none}
.tip span{flex:1;color:var(--sub)}
.tip span b{color:var(--lime)}
.bh{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.bh .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.bh h2{margin:0;font-size:24px;font-weight:800}
.bh small{color:var(--sub);font-size:13px}
.lead{color:var(--sub);margin:8px 0 14px}
.filter{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 75%,rgba(46,13,41,0));padding:10px 0 12px}
.search{position:relative;display:block}
.search input{width:100%;font:inherit;font-size:15px;padding:13px 14px 13px 44px;border-radius:14px;border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.1);color:#fff;outline:none}
.search input::placeholder{color:var(--mut)}
.search input:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(198,214,63,.15)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--lime)}
.jump{display:flex;gap:6px;overflow:auto;padding:10px 0 2px;scrollbar-width:none}
.jump button{flex:none;border:1px solid var(--line2);background:transparent;border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:700;color:var(--sub);white-space:nowrap}
.jump button:hover{color:#fff;border-color:var(--lime)}
.sub-h{display:flex;align-items:baseline;gap:8px;margin:22px 0 10px;font-weight:800;font-size:16px;scroll-margin-top:140px}
.sub-h small{color:var(--mut);font-weight:600;font-size:12.5px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 10px;scroll-margin-top:150px;transition:border-color .3s,box-shadow .3s}
.q.has{border-color:rgba(123,216,143,.35)}
.q.flash{border-color:var(--lime);box-shadow:0 0 0 3px rgba(198,214,63,.2)}
.q .nm{font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;display:flex;gap:8px;align-items:center}
.q .nm .okm{color:var(--ok);display:inline-flex;gap:4px;align-items:center}
.q .lb{font-weight:700;font-size:15px;margin:0 0 4px}
.q .hl{font-size:13px;color:var(--sub);margin:0 0 10px}
.inp{font:inherit;font-size:15.5px;padding:11px 13px;border:1px solid rgba(255,255,255,.34);border-radius:12px;background:rgba(255,255,255,.1);color:#fff;min-width:0}
.inp::placeholder{color:rgba(255,255,255,.55)}
.inp.bad{border-color:#FF8A8A;box-shadow:0 0 0 3px rgba(255,138,138,.2)}
.warn{font-size:12.5px;color:#FFB4B4;font-weight:700;margin:-2px 0 8px}
.inp:focus{outline:none;border-color:var(--lime);box-shadow:0 0 0 3px rgba(198,214,63,.15)}
select.inp option{background:#22041C}
input.num{width:140px}
.urow{display:flex;gap:10px;align-items:center;margin:0 0 8px;flex-wrap:wrap}
.unit{font-weight:700;color:var(--sub);font-size:14px}
.unit small{color:var(--mut);font-weight:600}
.note{font-size:12.5px;color:#C7F0D0;background:rgba(123,216,143,.1);border-radius:10px;padding:8px 10px;margin:0 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:transparent;border-radius:99px;padding:8px 13px;font-weight:700;font-size:13.5px;color:#fff}
.chip:hover{border-color:var(--lime)}
.chip[aria-pressed=true]{background:var(--lime);border-color:var(--lime);color:#26001D}
.when{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12.5px;color:var(--mut)}
.when .chip{padding:5px 10px;font-size:12px}
.auto{font-size:13px;font-weight:700;color:#C7F0D0;background:rgba(123,216,143,.08);border-radius:10px;padding:10px 12px}
.empty{color:var(--sub);text-align:center;padding:30px 10px}
.top-chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 6px}
.top-chips .chip.on{border-color:var(--ok);color:var(--ok)}
.qz{max-width:640px;margin:0 auto}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:18px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--lime));border-radius:99px;transition:width .3s}
.qn{font-size:12.5px;font-weight:700;color:var(--mut)}
.qq{font-size:26px;font-weight:800;line-height:1.22;margin:18px 0 18px;letter-spacing:-.01em}
.opts{display:grid;gap:10px}
.opt{border:1px solid var(--line2);background:var(--card);border-radius:16px;padding:16px 18px;font-weight:700;font-size:16px;text-align:left;display:flex;align-items:center;gap:12px}
.opt:hover{border-color:var(--lime)}
.opt .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);flex:none;display:grid;place-items:center;color:#26001D}
.opt.r .box{border-radius:50%}
.opt[aria-pressed=true]{border-color:var(--lime);background:rgba(198,214,63,.08)}
.opt[aria-pressed=true] .box{background:var(--lime);border-color:var(--lime)}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:22px}
.skip{border:0;background:none;color:var(--sub);font-weight:700;text-decoration:underline}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.big2 button{border:1px solid var(--line2);background:var(--card);border-radius:18px;padding:22px;font-weight:800;font-size:18px}
.big2 button[aria-pressed=true]{border-color:var(--lime);background:rgba(198,214,63,.1);color:var(--lime)}
.sug{background:var(--card2);border:1px solid var(--line2);border-radius:14px;box-shadow:0 14px 30px rgba(0,0,0,.4);overflow:hidden;margin-top:6px}
.sug button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;gap:10px;align-items:baseline;border-top:1px solid var(--line)}
.sug button:hover{background:rgba(255,255,255,.05)}
.sug small{color:var(--sub)}
.medl{display:grid;gap:8px;margin-top:12px}
/* MEINE:BEGIN – Meine Einträge + Schalter „Nur ausgefüllte“ (18.11.2026) */
.mgrp{margin:0 0 18px}.mgh{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:15px}.mgh small{margin-left:auto;color:var(--sub);font-weight:700}
.mrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin:0 0 6px}
.mrow .mt{flex:1;min-width:0;display:grid;gap:2px}.mrow .mt b{font-size:14px}.mrow .mt span{color:#C6D63F;font-weight:700;font-size:14px;overflow-wrap:anywhere}.mrow .mt small{color:var(--sub);font-size:12px}
.mdel{border:0;background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.mdel:hover{background:rgba(255,90,90,.25)}
.mine-empty{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:14px;justify-items:start}.mine-empty p{margin:0;color:var(--sub)}
.frow{display:flex;gap:10px;align-items:center}.frow .search{flex:1}
.onlyf{display:inline-flex;align-items:center;gap:8px;flex:none;border:1px solid var(--line);background:var(--card);color:#fff;border-radius:999px;padding:9px 14px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.onlyf small{color:var(--sub)}.onlyf .sw{width:30px;height:18px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;transition:background .2s}
.onlyf .sw i{position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.onlyf[aria-pressed="true"]{border-color:#C6D63F}.onlyf[aria-pressed="true"] .sw{background:#C6D63F}.onlyf[aria-pressed="true"] .sw i{transform:translateX(12px);background:#26001D}
#blist .sub-h[hidden],.top-chips[hidden],.sec-t[hidden],.jump[hidden]{display:none!important}
@media (max-width:560px){.frow{flex-wrap:wrap}.mrow{flex-wrap:wrap}.mrow .mt{flex-basis:100%}}
/* MEINE:END */
.medl div{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700}
.medl div small{color:var(--sub);font-weight:600;flex:1}
.medl button{border:0;background:rgba(255,255,255,.08);border-radius:10px;width:34px;height:34px;font-size:18px}
.scrim{display:none}
@media (max-width:820px){
 .shell{grid-template-columns:1fr}
 aside{display:none}
 .mtop{display:none!important}
 .tabs{display:flex;position:sticky;top:0;z-index:30;gap:6px;overflow-x:auto;padding:10px 12px;background:rgba(46,13,41,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);scrollbar-width:none}
 .tabs button{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;border-radius:12px;padding:6px 6px;width:74px;font-size:10.5px;font-weight:700;color:var(--sub);line-height:1.15;text-align:center}
 .tabs button .bi{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff}
 .tabs button[aria-current=page]{color:#fff;background:rgba(198,214,63,.12)}
 .content{padding:14px 14px 80px}
 .hero{height:auto;min-height:0;margin:-14px -14px 10px;padding:0 0 18px}
 .hero iframe{position:relative;display:block;top:auto;left:50%;transform:translateX(-50%);width:130%;height:auto;aspect-ratio:1;margin:-12% 0 -24%}
 .hero::after{background:linear-gradient(180deg,rgba(46,13,41,0) 0%,rgba(46,13,41,0) 40%,var(--bg) 64%)}
 .hero .tx{position:relative;left:auto;top:auto;transform:none;padding:0 18px;max-width:none}
 .hero h1{font-size:27px}
 .banner{padding:10px 14px;font-size:13px}
 .banner .go{padding:7px 9px}
 .banner .go span{display:none}
 .wzq{font-size:22px}
 .wzs div span{display:none}
 .sumg{grid-template-columns:1fr 1fr}
 .steps{grid-template-columns:1fr}
 .step{min-height:0}
 .qq{font-size:22px}
 .filter{top:78px}
 .tiles{grid-template-columns:1fr 1fr}
}
/* HELL:BEGIN – helles Theme per ?hell=1 (Daniel 17.11.2026: Popup in der App hob sich nicht ab) */
html.light{--bg:#FBF6FA;--bg2:#FFFFFF;--card:#FFFFFF;--card2:#F7EEF4;--line:rgba(94,0,71,.12);--line2:rgba(94,0,71,.24);--ink:#26001D;--sub:rgba(38,0,29,.74);--mut:rgba(38,0,29,.52);--ok:#2E9E4F;--lt:#6F7F0A}
html.light .eyebrow,html.light .logo b span,html.light .ni .ic,html.light .tip .i,html.light .big2 button[aria-pressed=true]{color:var(--lt)}
html.light .ni:hover{background:rgba(94,0,71,.05);color:var(--ink)}
html.light .ni[aria-current=page],html.light .tabs button[aria-current=page]{background:rgba(198,214,63,.22);color:var(--ink)}
html.light .ni .ic{background:rgba(94,0,71,.06)}
html.light .wzs div i,html.light .bar,html.light .medl button{background:rgba(94,0,71,.08)}
html.light .wzs div.cur,html.light .jump button:hover{color:var(--ink)}
html.light .bl.ghost{background:#fff}
html.light .search input,html.light .inp{background:#fff;border-color:rgba(94,0,71,.26);color:var(--ink)}
html.light .inp::placeholder{color:rgba(38,0,29,.42)}
html.light select.inp option{background:#fff}
html.light .chip{color:var(--ink)}

/* Rad-Diagramm: deine Angaben je Bereich */
function wheel(){
  const W=560,c=W/2,R0=92,R1=196,TAU=Math.PI*2,bs=D.b,n=bs.length,gap=.012;let svg='';
  const P=(r,a)=>[(c+r*Math.cos(a)).toFixed(1),(c+r*Math.sin(a)).toFixed(1)];
  const arc=(r0,r1,a0,a1)=>{const [x0,y0]=P(r1,a0),[x1,y1]=P(r1,a1),[x2,y2]=P(r0,a1),[x3,y3]=P(r0,a0),l=(a1-a0)>Math.PI?1:0;return `M${x0},${y0} A${r1},${r1} 0 ${l} 1 ${x1},${y1} L${x2},${y2} A${r0},${r0} 0 ${l} 0 ${x3},${y3}Z`};
  let tot=0;
  bs.forEach((b,i)=>{const a0=-Math.PI/2+TAU*i/n+gap,a1=-Math.PI/2+TAU*(i+1)/n-gap,am=(a0+a1)/2;
    const ps=b.s.flatMap(s=>s.p).filter(vis),inp=ps.filter(INPUT),auto=!inp.length&&b.name==='Gene & DNA';
    let d=inp.filter(p=>has(p.id)).length;if(b.name.startsWith('Medikamente'))d=S.med.length+S.supp.length;if(b.name==='Erkrankungen')d=inp.filter(p=>has(p.id)).length;
    tot+=d;const share=auto?1:d?Math.max(.18,Math.min(1,Math.sqrt(d/Math.max(inp.length,1))*1.6)):0;
    svg+=`<path d="${arc(R0,R1,a0,a1)}" fill="${b.c}" opacity=".16"/>`;
    if(share)svg+=`<path d="${arc(R0,R0+(R1-R0)*share,a0,a1)}" fill="${b.c}"/>`;
    const [ix,iy]=P(R1+16,am);svg+=`<g transform="translate(${ix},${iy})">${ico(BIC[b.name]||'list',14).replace('<svg','<svg x="-7" y="-7" style="color:'+b.c+'"')}</g>`;
    const [tx,ty]=P(R1+34,am),deg=am*180/Math.PI,flip=Math.cos(am)<0;
    svg+=`<text transform="translate(${tx},${ty}) rotate(${flip?deg+180:deg})" text-anchor="${flip?'end':'start'}" dy="4" font-size="11" font-weight="700" fill="${d||auto?'#fff':'rgba(255,255,255,.5)'}">${esc(bname(b).replace(' & Unverträglichkeiten','').replace(' & Biologisches Alter','').replace(' & Untersuchungen','').replace(' & Heimgeräte',''))}${auto?' ✓':d?' · '+d:''}</text>`});
  svg+=`<circle cx="${c}" cy="${c}" r="${R0-10}" fill="#5E0047" stroke="#C6D63F" stroke-width="2"/><text x="${c}" y="${c-4}" text-anchor="middle" font-size="34" font-weight="800" fill="#C6D63F">${tot}</text><text x="${c}" y="${c+20}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">deine Angaben</text>`;
  return `<div class="wheel"><svg viewBox="-80 -20 ${W+160} ${W+40}" role="img" aria-label="Deine Angaben je Bereich">${svg}</svg></div>`;
}

  const gs=e.target.closest('[data-gw]');if(gs){setGw(+gs.dataset.gw);return}
  const dx=e.target.closest('[data-dx]');if(dx){const id=dx.dataset.dx,on=!dxOn(id);
    if(C2D[id]){const a=new Set(((S.val.health_conditions||{}).v)||[]);a.delete('Keine');if(on)a.add(C2D[id]);else a.delete(C2D[id]);if(a.size)S.val.health_conditions={v:[...a]};else delete S.val.health_conditions;delete S.val[id]}
    else if(on)S.val[id]={v:'Ja'};else delete S.val[id];save();dx.setAttribute('aria-pressed',on);side();return}
  if(e.target.closest('[data-restart]')){sessionStorage.setItem('lsq',0);go('lifestyle');return}
  if(e.target.closest('[data-coach]')){goCoach();return}
  const j=e.target.closest('[data-jump]');if(j){$(j.dataset.jump).scrollIntoView({behavior:'smooth',block:'start'});return}
  const jq=e.target.closest('[data-jumpq]');if(jq){const el=$('q-'+jq.dataset.jumpq);el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600);const f=el.querySelector('input.num');if(f)setTimeout(()=>f.focus({preventScroll:true}),450);return}
  const m=e.target.closest('[data-med]');if(m){S.medAns=m.dataset.med;save();render();return}
  const rm=e.target.closest('[data-rm]');if(rm){S.med.splice(+rm.dataset.rm,1);save();render();return}
  const rms=e.target.closest('[data-rms]');if(rms){S.supp.splice(+rms.dataset.rms,1);save();render();return}
  const pk=e.target.closest('[data-pick]');if(pk){const x=D.med[+pk.dataset.pick]||{n:pk.dataset.free};if(!S.med.some(y=>y.n===x.n))S.med.push({n:x.n,w:x.b?'z. B. '+x.b.split(' ').slice(0,3).join(', '):'',free:!D.med[+pk.dataset.pick]});save();render();setTimeout(()=>{const q=$('qmed');if(q)q.focus()},30);return}
  if(e.target.closest('#suppadd')){const v=$('supp').value.trim();if(v){S.supp.push(v);save();render()}return}
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.mh!=null){const m=S.med[+e.target.dataset.mh];if(m){m.h=e.target.value;save()}}});
document.addEventListener('input',e=>{
  if(e.target.id==='qb')bFilter();
  if(e.target.id==='qmess'){const q=norm(e.target.value.trim()),box=$('messres');if(q.length<2){box.innerHTML='';return}
    const hits=MESS.filter(vis).map(p=>[p,score(p,q,p.t)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0]);
    box.innerHTML=hits.length?hits.map(card).join(''):'<div class="empty">Nicht gefunden – probier ein anderes Wort oder frag den GENEius-Chat.</div>';
    box.querySelectorAll('[data-q]').forEach(el=>bindField(el,BYID[el.dataset.q]))}
  if(e.target.id==='qwear'){const q=norm(e.target.value.trim());document.querySelectorAll('#wtab tbody tr').forEach(r=>r.hidden=!!q&&!r.dataset.w.includes(q))}
  if(e.target.id==='qdx'){const q=norm(e.target.value.trim());document.querySelectorAll('#dxl .chip').forEach(c=>c.hidden=!!q&&!norm(c.textContent).includes(q));document.querySelectorAll('#dxl .dxg').forEach(g=>g.hidden=![...g.querySelectorAll('.chip')].some(c=>!c.hidden))}
  if(e.target.id==='qmed'){const q=norm(e.target.value.trim()),box=$('medsug');if(q.length<2){box.innerHTML='';return}
    const hits=[];D.med.forEach((m,i)=>{if(hits.length<8&&norm(m.n+' '+(m.b||'')+' '+(m.en||'')).includes(q))hits.push(i)});
    box.innerHTML=`<div class="sug">${hits.map(i=>{const m=D.med[i];return `<button type="button" data-pick="${i}"><b>${esc(m.n)}</b><small>${m.b?esc(m.b.split(' ').slice(0,4).join(', ')):'Wirkstoff'}</small></button>`}).join('')}<button type="button" data-pick="-1" data-free="${esc(e.target.value.trim())}"><b>„${esc(e.target.value.trim())}“</b><small>so übernehmen – ohne Wechselwirkungsprüfung</small></button></div>`}
  if(e.target.dataset.md!=null){const m=S.med[+e.target.dataset.md];if(m){m.d=e.target.value.trim();save()}}
});
$('banner').innerHTML=`<span class="i">${ico('chat',18)}</span><span class="t"><b>Lass GENEius die Daten für dich eintragen</b> Geh einfach zum GENEius-Chat und lade deine Befunde hoch – GENEius trägt die Felder automatisch für dich ein.</span><span class="go"><span>Zum Chat</span>${ico('chev',14)}</span>`;

(function(){const b=$('banner');let off=false;try{off=sessionStorage.getItem('gn-blase-zu')==='1'}catch(e){}if(off){b.hidden=true;return}const x=document.createElement('button');x.className='banx';x.type='button';x.setAttribute('aria-label','Hinweis schließen');x.innerHTML='&#10005;';b.after(x);x.onclick=()=>{b.hidden=true;x.remove();try{sessionStorage.setItem('gn-blase-zu','1')}catch(e){}}})();
render();
</script>
